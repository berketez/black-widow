[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karadul"
version = "1.20.0-pre"
description = "Black Widow (Karadul) — Multi-language reverse engineering and binary reconstruction suite"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Berke Tezgocen"},
]
keywords = [
    "reverse-engineering",
    "binary-analysis",
    "decompilation",
    "deobfuscation",
    "malware-analysis",
    "ghidra",
    "electron",
    "javascript",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "dataclasses-json>=0.6",
    "tqdm>=4.60",
]

[project.urls]
Homepage = "https://github.com/berketez/black-widow"
Documentation = "https://github.com/berketez/black-widow/tree/main/docs"
Issues = "https://github.com/berketez/black-widow/issues"

[project.optional-dependencies]
binary = ["capstone>=5.0", "lief>=0.14"]
cpp = ["cxxfilt>=0.3"]
dynamic = ["frida-tools>=12.0"]
ghidra = ["capstone>=5.0", "lief>=0.14", "pyghidra>=3.0.0,<4.0"]
js = ["pyyaml>=6.0"]
yara = ["yara-python>=4.3.0"]  # v1.10.0 Batch 5B HIGH-9: CVE-2019-11517 koruma (<4.3 zayif)
ml = ["torch>=2.2.0", "transformers>=4.40.0", "tokenizers>=0.19.0", "safetensors>=0.4.0", "accelerate>=0.30.0"]
deobf = ["z3-solver>=4.12.0"]
computation = ["z3-solver>=4.12.0", "sympy>=1.12", "networkx>=3.0"]
perf = ["lmdb>=1.4", "msgpack>=1.0", "pyahocorasick>=2.0"]
app = ["pywebview>=5.0"]  # native macOS penceresi (WKWebView) -- Black Widow .app bundle
decompilers = ["angr>=9.2"]
# TypeForge, Ghidra headless wrapper uzerinden subprocess ile calisir.
# Python tarafinda ek bagimliligi yok; Ghidra + Java 17+ + Gradle kurulumu
# scripts/setup_typeforge.sh ile yapilir.
typeforge = []
# TRex, vendor/trex/ Rust CLI'i subprocess ile calistirir. Python bagimliligi yok.
# Gereksinim: cargo build --release (vendor/trex/) + Ghidra + Java 17+
# Rust toolchain kurulumu Berke'nin karari (Faz 2).
trex = []
full = ["karadul[binary,dynamic,ghidra,js,yara,ml,deobf,computation,perf,decompilers,typeforge,trex,app,dev]"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.8"]
all = ["karadul[full]"]

[project.scripts]
karadul = "karadul.cli:main"
karadul-hack = "karadul.hacker_cli:main"
blackwidow = "karadul.cli:main"

[tool.setuptools.packages.find]
include = ["karadul*"]

# KISIT: package-data anahtarlari PAKET adidir, glob'lar O PAKETIN dizinine
# GORE cozulur. Bu yuzden "templates/*.json" gibi bir desen `karadul` anahtari
# altina yazilirsa `karadul/templates/` aranir, HICBIR SEY eslesmez ve pip
# sessizce bos gecer (hata vermez) -- known_algorithms.json tam olarak boyle
# kaybolmustu. Veri dosyasi bir alt-dizindeyse, o dizini iceren EN YAKIN
# paketin adi anahtar olmalidir.
#
# TUZAK: `templates/`, `hooks/` ve `scripts/trex/` birer Python paketi DEGIL
# (__init__.py yok) -> packages.find bunlari bulamaz, iceriklerinin gelmesinin
# TEK yolu asagidaki package-data girdileridir.
#
# TUZAK: MANIFEST.in'deki `recursive-include karadul *.py *.js` + setuptools'un
# include-package-data=True varsayilani, .js dosyalarini ZATEN ortuyordu; yani
# frida hook'lari buraya yazilmadan da geliyordu. Bu ORTUK bir bagimlilik --
# MANIFEST.in degisirse sessizce kirilir. Asagida acikca tekrar belirtildiler.
[tool.setuptools.package-data]
karadul = [
    "ghidra/*.py",
    "py.typed",
]
"karadul.resources" = ["*.json"]
"karadul.frida" = ["hooks/*.js"]
# TRex Ghidra headless script'leri: Java kaynagi olarak subprocess'e verilir,
# import edilmez -> paketten duserse TRex asamasi sessizce calismaz.
"karadul.ghidra" = ["scripts/trex/*.java"]
# CFG parmak izi sablonlari (known_algorithms.json) -- cfg_fingerprint.py
# bunu Path(__file__).parent/"templates" ile ACAR, yoksa 0 sablonla calisir.
"karadul.reconstruction.recovery_layers" = ["templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not integration and not benchmark'"
markers = [
    "network: tests that require network access",
    "integration: tests that need root/SIP/external daemon (Frida spawn etc.)",
    "benchmark: long-running performance tests (skipped in default suite)",
    "requires_external_binary: tests that need system libs (libsqlite3, libcrypto) present on host",
    "requires_typeforge: tests that need TypeForge CLI installed (Ghidra headless wrapper)",
]
