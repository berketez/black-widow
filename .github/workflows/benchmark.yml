name: Benchmark-marked tests

# Runs the tests marked `benchmark` (excluded from the default pytest selection).
# They exercise the metric and benchmark code on committed fixtures.
# This is NOT an accuracy gate: no F1 threshold is checked, and nothing here
# measures how good Karadul's names are. (The earlier "F1 gate" compared a
# hard-coded number from scripts/run_mock_benchmark.py with a threshold; it was removed.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-tests:
    name: Benchmark-marked tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install karadul with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,perf,binary,computation,cpp]"

      # tests/test_pipeline_e2e_real_binary.py runs `karadul analyze` end to end and
      # needs Ghidra, which the runner does not have.
      # tests/benchmark/test_parallel_naming_perf.py asserts a parallel speed-up (>= 1.3x)
      # and may be sensitive to runner load.
      - name: Run benchmark-marked tests
        run: |
          python -m pytest -q -rfEs -m "benchmark and not integration" \
            --ignore=tests/test_pipeline_e2e_real_binary.py
